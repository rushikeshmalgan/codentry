name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - run: npm run lint --workspace apps/web
      - run: npm run typecheck --workspace apps/web
      - run: npm run test --workspace apps/web
      - run: npm run build --workspace apps/web

  ai-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: services/ai-review/requirements-dev.txt
      # Needed for the analysis/ ESLint runner (Phase 3) — Semgrep is pure
      # Python and doesn't need this, but ESLint does.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ai-review/analysis/eslint-baseline/package-lock.json
      - run: npm install
        working-directory: services/ai-review/analysis/eslint-baseline
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -v
      # Evaluation harness: lives outside the service and imports only `analysis`
      # (test_scope_guards.py pins that direction). Runs the real ESLint/Semgrep,
      # including two full CLI runs whose outputs must be byte-identical.
      - name: Lint evaluation harness
        working-directory: ${{ github.workspace }}
        run: ruff check evaluation
      - name: Test evaluation harness
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/services/ai-review
        run: python -m pytest evaluation/tests -v
