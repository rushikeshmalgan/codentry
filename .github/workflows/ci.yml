name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - run: npm run lint --workspace apps/web
      - run: npm run typecheck --workspace apps/web
      - run: npm run test --workspace apps/web
      - run: npm run build --workspace apps/web

  ai-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: services/ai-review/requirements-dev.txt
      # Needed for the analysis/ ESLint runner (Phase 3) — Semgrep is pure
      # Python and doesn't need this, but ESLint does.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ai-review/analysis/eslint-baseline/package-lock.json
      - run: npm install
        working-directory: services/ai-review/analysis/eslint-baseline
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -v
      # Evaluation harness: lives outside the service and imports only `analysis`
      # (test_scope_guards.py pins that direction). Runs the real ESLint/Semgrep,
      # including two full CLI runs whose outputs must be byte-identical.
      - name: Lint evaluation harness
        working-directory: ${{ github.workspace }}
        run: ruff check evaluation
      - name: Test evaluation harness
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/services/ai-review
        run: python -m pytest evaluation/tests -v

  # The deployable artifact: the same Dockerfile Render builds. Builds the production
  # image, runs the service tests inside the `test` target, and runs the analysis CLI
  # in the production image with no network and a read-only root filesystem.
  ai-review-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-review
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t codentry-ai-review .
      - name: Build test image
        run: docker build --target test -t codentry-ai-review:test .
      - name: Service tests inside the container
        run: docker run --rm codentry-ai-review:test
      - name: Analysis CLI in the production image (no network, read-only)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            codentry-ai-review python -m analysis.run analysis/fixtures eslint_sample.js semgrep_sample.js \
            > "$RUNNER_TEMP/cli.json"
          cat "$RUNNER_TEMP/cli.json"
          grep -q '"overall_status": "completed"' "$RUNNER_TEMP/cli.json"
          grep -q '"finding_count": 5' "$RUNNER_TEMP/cli.json"
