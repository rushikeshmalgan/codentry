# Render Blueprint for services/ai-review.
# Apply via Render's "New Blueprint Instance" flow pointed at this repo, or
# configure the equivalent settings manually in the Render dashboard — see
# docs/deployment.md for the manual steps and required environment variables.

services:
  - type: web
    name: codentry-ai-review
    runtime: python
    rootDir: services/ai-review
    plan: free
    # NOTE (Phase 3, unverified against a real Render deploy): ESLint needs
    # Node.js. Render's Python native runtime is not confirmed here to have
    # `node` preinstalled — if the build fails on the npm install step,
    # either switch this service to Render's Node runtime and shell out to
    # `python3` instead, or use a Dockerfile that installs both runtimes.
    # Semgrep alone (pip-installed, no Node needed) still works either way.
    buildCommand: pip install -r requirements.txt && cd analysis/eslint-baseline && npm install
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Secrets (GITHUB_APP_*, INTERNAL_HANDOFF_SECRET, SUPABASE_*,
      # CLAUDE_API_KEY) are set manually in the Render dashboard, never
      # committed here. Not needed until Phase 2/4/9.
