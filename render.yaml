# Render Blueprint for services/ai-review.
# Apply via Render's "New Blueprint Instance" flow pointed at this repo, or
# configure the equivalent settings manually in the Render dashboard — see
# docs/deployment.md for the manual steps and required environment variables.

services:
  - type: web
    name: codentry-ai-review
    # Docker runtime: one image carrying Python (service + Semgrep) AND Node (ESLint).
    # Render's native Python runtime was never confirmed to ship `node`, so the earlier
    # buildCommand (`pip install ... && npm install`) was a guess; the image removes it.
    # The Dockerfile's last stage is the production image. It is built and run locally
    # (docs/PROJECT_STATUS.md), but NOT VERIFIED ON RENDER ITSELF.
    runtime: docker
    dockerfilePath: ./services/ai-review/Dockerfile
    dockerContext: ./services/ai-review
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Secrets (GITHUB_APP_ID, GITHUB_PRIVATE_KEY, CODENTRY_INTERNAL_WEBHOOK_SECRET,
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) are set manually in the Render
      # dashboard, never committed here.
      # With ENVIRONMENT=production the service REFUSES TO START unless
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and CODENTRY_INTERNAL_WEBHOOK_SECRET
      # are set (no in-memory fallback). Apply supabase/migrations/0001-0004 first.
      # There is no AI review, so no CLAUDE_API_KEY is needed.
